[project]
name = "gmex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Grant M. Rotskoff", email = "grant@rotskoff.cc" }
]
requires-python = ">=3.12"
dependencies = [
    "deeptime>=0.4.5",
    "h5py>=3.15.1",
    "ipympl>=0.9.4",
    "jupyter>=1.1.1",
    "lightning>=2.5.0.post0",
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
    "opencv-python>=4.12.0.88",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pickleshare>=0.7.5",
    "py-step-detect",
    "pytest>=8.3.4",
    "ruff>=0.16.7",
    "scipy>=1.15.0",
    "statsmodels>=0.14.5",
    "torch>=2.5.1",
    "torchao>=0.12.0",
    "torchsde>=0.2.6",
    "torchtune>=0.6.1",
    "tqdm>=4.67.1",
    "ty>=0.0.80",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["gmex"]

[tool.uv.sources]
py-step-detect = { git = "https://github.com/cjoshliu/py-step-detect.git" }

[project.scripts]
gmex = "gmex.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
